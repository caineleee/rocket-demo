# ============================================================
# pay-service 本地配置（公共部分已上移 Nacos 共享配置）
# ============================================================
spring:
  application:
    name: pay-service
  config:
    import:
      - optional:nacos:shared-spring-dev.yaml
      - optional:nacos:shared-datasource-dev.yaml
      - optional:nacos:shared-mybatis-dev.yaml
      - optional:nacos:shared-dubbo-dev.yaml
      - optional:nacos:shared-mq-dev.yaml
      - optional:nacos:shared-idworker-dev.yaml
      - optional:nacos:shared-sentinel-dev.yaml
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: rocket-demo
      discovery:
        namespace: rocket-demo
    sentinel:
      transport:
        port: 8724

server:
  port: 8083

dubbo:
  application:
    name: pay-service-dubbo
    qos-port: 22223

rocketmq:
  producer:
    group: pay-producer-group
  consumer:
    group: pay-consumer-group
  # order-failure 消费者组已移除（Seata AT 全局事务回滚替代 MQ 失败补偿，pay 走 MQ 异步不在同步全局事务内）
  topics:
    pay: pay-topic
  tags:
    pay: paid
