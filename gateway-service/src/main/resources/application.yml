# ============================================================
# gateway-service 本地配置（仅加载 shared-spring-dev.yaml + shared-sentinel-dev.yaml；无 DB/Dubbo/MQ）
# ============================================================
spring:
  application:
    name: gateway-service
  config:
    import:
      - optional:nacos:shared-spring-dev.yaml
      - optional:nacos:shared-sentinel-dev.yaml
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: rocket-demo
      discovery:
        namespace: rocket-demo
    gateway:
      routes:
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/order/**
        - id: goods-service
          uri: lb://goods-service
          predicates:
            - Path=/goods/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user/**
        - id: pay-service
          uri: lb://pay-service
          predicates:
            - Path=/pay/**
        - id: coupon-service
          uri: lb://coupon-service
          predicates:
            - Path=/coupon/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
    sentinel:
      transport:
        port: 8719

server:
  port: 8080

# 日志级别统一交给 common 的 logback-spring.xml 管理（不要长期留 DEBUG）
logging:
  level:
    root: INFO
