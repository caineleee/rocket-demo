# ============================================================
# common 模块共享配置（classpath 加载，所有依赖 common 的服务自动拥有）
# id-worker 已上移至 Nacos shared-idworker-dev.yaml
# 利用 Spring Boot 原生 SpEL 表达式，启动时自动获取本机局域网IP
# ⚠️ YAML中SpEL必须加单引号或双引号！
# ============================================================
app:
  local-ip: '#{T(java.net.InetAddress).getLocalHost().hostAddress}'
