# ============================================================
# user-service 本地配置（公共部分已上移 Nacos 共享配置）
# 本地仅保留：身份 / bootstrap 引导 / 各服务独有的变量值
# ============================================================
spring:
  application:
    name: user-service
  # 启用 Nacos 配置导入（optional: 拉取不到不致命）
  config:
    import:
      - optional:nacos:shared-spring-dev.yaml
      - optional:nacos:shared-datasource-dev.yaml
      - optional:nacos:shared-mybatis-dev.yaml
      - optional:nacos:shared-dubbo-dev.yaml
      - optional:nacos:shared-mq-dev.yaml
      - optional:nacos:shared-idworker-dev.yaml
      - optional:nacos:shared-sentinel-dev.yaml
  cloud:
    nacos:
      # config.server-addr + namespace 必须本地（bootstrap 阶段先连 Nacos 才能拉共享配置）
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: rocket-demo
      # discovery.namespace 与 config 一致，服务注册到 rocket-demo
      discovery:
        namespace: rocket-demo
    sentinel:
      transport:
        port: 8720

server:
  port: 8084

# Dubbo 应用名与 Spring Cloud 应用名分离（-dubbo 后缀），避免 RPC/HTTP 实例混注册
dubbo:
  application:
    name: user-service-dubbo
    qos-port: 22224

rocketmq:
  producer:
    group: user-producer-group
  # 订单确认失败回滚消费者组
  consumer:
    order-failure:
      group: order-cancel-consumer-group
