# ============================================================
# order-service 本地配置（公共部分已上移 Nacos 共享配置）
# 注：order 还有 OpenFeign 配置 + 自定义 MQ 消费者组（仅 order 使用）
# ============================================================
spring:
  application:
    name: order-service
  config:
    import:
      - optional:nacos:shared-spring-dev.yaml
      - optional:nacos:shared-datasource-dev.yaml
      - optional:nacos:shared-mybatis-dev.yaml
      - optional:nacos:shared-dubbo-dev.yaml
      - optional:nacos:shared-mq-dev.yaml
      - optional:nacos:shared-idworker-dev.yaml
      - optional:nacos:shared-sentinel-dev.yaml
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: rocket-demo
      discovery:
        namespace: rocket-demo
    sentinel:
      transport:
        port: 8721

server:
  port: 8081

dubbo:
  application:
    name: order-service-dubbo
    qos-port: 22221

# OpenFeign 配置（仅 order-service 使用）
feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 5000
        logger-level: BASIC

rocketmq:
  producer:
    group: order-producer-group

# RocketMQ 消费者组与主题（order 自定义业务属性，供 @Value 注入）
mq:
  order-failure:
    consumer:
      group: order-order-cancel-group
  payment:
    consumer:
      group: payment-consumer-group
  topics:
    payment: pay-topic
  tags:
    # '*' 在 YAML 中是别名指示符，必须加引号
    order-failure: '*'
