spring.application.name=order-service
server.port=8081

# IdWorker 配置(分布式ID生成器)
id-worker.worker-id=1
id-worker.datacenter-id=1

# ========================================
# MySQL 数据库配置
# ========================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:rocket-demo-db}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:root}

# MyBatis-Plus 配置
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.type-aliases-package=org.lee.rocket.train.service.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# 完全禁用 Spring Cloud Nacos Config(不从Nacos读取配置)
spring.cloud.nacos.config.enabled=false
spring.config.import=
nacos.logging.default.config.enabled=false

# ========================================
# Nacos Discovery 配置（服务注册与发现）
# ========================================
# 【OpenFeign 示例】
# OpenFeign 需要配合 Nacos Discovery 使用，实现服务发现和负载均衡。
# order-service 注册到 Nacos 后，才能通过服务名调用其他服务（如 goods-service）。
# 注意：这里使用的是 Nacos Discovery（服务发现），不是 Nacos Config（配置管理）。
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
spring.cloud.nacos.discovery.namespace=public

# ========================================
# OpenFeign 配置
# ========================================
# 【OpenFeign 示例】
# 配置 Feign Client 的超时时间和日志级别。
# 这些配置是可选的，但建议在生产环境中明确设置。
# connect-timeout：连接超时时间（毫秒），默认 10 秒
# read-timeout：读取超时时间（毫秒），默认 60 秒
# logger-level：日志级别（NONE/BASIC/HEADERS/FULL）
#   - NONE：不记录任何日志（默认）
#   - BASIC：仅记录请求方法、URL、响应状态码、执行时间
#   - HEADERS：在 BASIC 基础上，记录请求和响应的头信息
#   - FULL：记录请求和响应的头信息、正文和元数据（调试用）
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000
feign.client.config.default.logger-level=BASIC

# ========================================
# LoadBalancer 配置（负载均衡）
# ========================================
# 【OpenFeign 示例】
# Spring Cloud LoadBalancer 是 OpenFeign 的客户端负载均衡器。
# 当调用 goods-service 时，会从 Nacos 获取所有实例，根据负载均衡策略选择一个实例。
#
# 负载均衡策略配置：
# - 默认策略：轮询（Round Robin）
# - 自定义策略：在启动类上通过 @LoadBalancerClient 注解配置
#   示例：@LoadBalancerClient(name = "goods-service", configuration = GoodsServiceLoadBalancerConfig.class)
#   对比 Dubbo：@DubboReference(loadbalance = "random") 一行搞定
#   OpenFeign 需要写配置类 GoodsServiceLoadBalancerConfig，比较繁琐
#
# 配置位置说明：
# - 负载均衡策略配置在启动类上，不在 application.properties 中
# - 因为 Spring Cloud LoadBalancer 不支持通过 properties 文件配置策略类
# - 必须通过 Java 配置类 + @LoadBalancerClient 注解指定
#
# 当前 goods-service 使用随机策略（Random），详见 GoodsServiceLoadBalancerConfig.java

# RocketMQ name-server & producer group
#rocketmq.name-server=namesrv-1:9876;namesrv-2:9876;namesrv-3:9876
rocketmq.name-server=${ROCKETMQ_NAMESRV:localhost:9876}
rocketmq.producer.group=order-producer-group

# ========================================
# RocketMQ Consumer 配置
# ========================================

# 订单确认失败,回滚主题消费者组
mq.order-failure.consumer.group=order-cancel-consumer-group
mq.topics.order-failure=order-failure-topic
mq.tags.order-failure=*

mq.payment.consumer.group=payment-consumer-group
mq.topics.payment=pay-topic

# Docker Compose
spring.docker.compose.lifecycle-management=start-only
#spring.docker.compose.stop.command=down


# Dubbo 应用名与 Spring Cloud 应用名分离，避免 Dubbo RPC 实例与 Spring Cloud HTTP 实例
# 在 Nacos 中注册到同一服务名下，导致 Gateway 的 LoadBalancer 随机选中 RPC 端口（返回 500）。
# Dubbo 消费方通过接口→应用映射自动发现新的应用名，无需额外配置。
dubbo.application.name=order-service-dubbo

# Zookeeper
#dubbo.registries.zk.id=zk
#dubbo.registries.zk.protocol=zookeeper
#dubbo.registries.zk.address=192.168.5.22:2181

# Nacos (仅用作 Dubbo 注册中心)
dubbo.registries.nacos.id=nacos
dubbo.registries.nacos.protocol=nacos
dubbo.registries.nacos.address=${NACOS_SERVER_ADDR:localhost:8848}

# 禁用 Dubbo 配置中心和元数据中心(只使用注册中心功能)
dubbo.config-center.address=
dubbo.metadata-report.address=


dubbo.provider.register-mode=application
# 禁用 Dubbo 启动时服务检查(开发环境使用,避免依赖服务未启动导致失败)
dubbo.consumer.check=false
# 设置消费者超时时间为3秒(默认1秒太短,容易超时)
dubbo.consumer.timeout=3000


dubbo.protocol.name=dubbo
dubbo.protocol.port=-1

# Dubbo QoS 端口(每个服务独立,避免冲突)
dubbo.application.qos-port=22221

dubbo.provider.version=1.0.0
dubbo.provider.group=default

# Dubbo 序列化安全(开发环境禁用严格模式,避免白名单配置麻烦)
dubbo.security.serialize.check=false

# Redis 配置
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ========================================
# Sentinel 配置
# ========================================
# Sentinel Dashboard 地址
spring.cloud.sentinel.transport.dashboard=localhost:8858
# 当前服务与 Dashboard 通信的端口
spring.cloud.sentinel.transport.port=8721
# 启用 Sentinel 懒加载（首次访问时才初始化，加快启动速度）
spring.cloud.sentinel.eager=true
# 启用 HTTP 方法区分，让 Sentinel 区分同一 URL 路径的不同 HTTP 方法（GET/POST/PUT/DELETE）
spring.cloud.sentinel.http-method-specify=true

