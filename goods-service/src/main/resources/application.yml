# ============================================================
# goods-service 本地配置（公共部分已上移 Nacos 共享配置）
# 注：goods 原本 dubbo.consumer 无 timeout/retries，现统一为 retries:0（更安全）
# ============================================================
spring:
  application:
    name: goods-service
  config:
    import:
      - optional:nacos:shared-spring-dev.yaml
      - optional:nacos:shared-datasource-dev.yaml
      - optional:nacos:shared-mybatis-dev.yaml
      - optional:nacos:shared-dubbo-dev.yaml
      - optional:nacos:shared-mq-dev.yaml
      - optional:nacos:shared-idworker-dev.yaml
      - optional:nacos:shared-sentinel-dev.yaml
      - optional:nacos:shared-seata-client-dev.yaml
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: rocket-demo
      discovery:
        namespace: rocket-demo
    sentinel:
      transport:
        port: 8722

server:
  port: 8082

dubbo:
  application:
    name: goods-service-dubbo
    qos-port: 22222

rocketmq:
  producer:
    group: goods-producer-group
  # order-failure 消费者组已移除（Seata AT 全局事务回滚替代 MQ 失败补偿）

# Seata 客户端配置（共享部分从 Nacos shared-seata-client-dev.yaml 加载，本地仅留服务专属的 application-id）
seata:
  application-id: ${spring.application.name}
